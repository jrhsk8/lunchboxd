<!doctype html>
<!--
  Source for public/brand/og.png, the 1200x630 link preview card.

  Rendered by scripts/render-og.py (headless Chromium). Kept as HTML rather
  than a binary-only asset so the card can be re-rendered when the branding
  moves — edit here, re-run the script, commit the PNG.

  The mark is the same path data as the header lockup in src/App.tsx, and the
  typeface is the self-hosted woff2 from public/fonts.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Schibsted Grotesk';
        font-style: normal;
        font-weight: 400 800;
        src: url('../public/fonts/schibsted-grotesk-latin.woff2') format('woff2');
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #1a1815;
        font-family: 'Schibsted Grotesk', system-ui, sans-serif;
        color: #fcfcfc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 28px;
        padding: 0 88px;
        /* The clay glow the panels imply, pushed to the corner so the card
           isn't a flat rectangle at thumbnail size. */
        background-image: radial-gradient(900px 500px at 88% 12%, #2a2118 0%, #1a1815 62%);
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .wordmark {
        font-size: 76px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .clay {
        color: #fca044;
      }
      h1 {
        font-size: 58px;
        font-weight: 700;
        line-height: 1.1;
        max-width: 15ch;
      }
      p {
        font-size: 28px;
        color: #a8a096;
        max-width: 34ch;
        line-height: 1.4;
      }
      .stars {
        font-size: 40px;
        letter-spacing: 6px;
        color: #fca044;
      }
      .dim {
        color: #34302a;
      }
      .rule {
        width: 96px;
        height: 5px;
        background: #fca044;
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <div class="lockup">
      <svg viewBox="0 0 48 48" width="68" height="68" aria-hidden="true">
        <rect
          x="4"
          y="19"
          width="40"
          height="23"
          rx="4"
          fill="none"
          stroke="#fcfcfc"
          stroke-width="3.5"
        />
        <path
          d="M16 19 v-3.5 a3.5 3.5 0 0 1 3.5 -3.5 h9 a3.5 3.5 0 0 1 3.5 3.5 v3.5"
          fill="none"
          stroke="#fcfcfc"
          stroke-width="3.5"
        />
        <path
          d="M24 24 l2 4 4.4 .6 -3.2 3.1 .8 4.3 -4 -2.1 -4 2.1 .8 -4.3 -3.2 -3.1 4.4 -.6 z"
          fill="#fca044"
        />
      </svg>
      <span class="wordmark">lunchbox<span class="clay">d</span></span>
    </div>
    <div class="rule"></div>
    <h1>Every bite goes on the record</h1>
    <p>Like Letterboxd, but you can eat the subject matter.</p>
    <div class="stars">★★★★<span class="dim">★</span></div>
  </body>
</html>
